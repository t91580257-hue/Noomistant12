name: Build noomistunt Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  ANDROID_PLATFORM: "android-34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  NDK_VERSION: "23.2.8568313"
  CMAKE_VERSION: "3.10.2.4988404"

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Unpack project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f project.godot ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: ZIP проекта не найден!"
              exit 1
            fi

            mkdir -p _unpack
            unzip -q "$ZIP_FILE" -d _unpack

            PROJECT_FILE="$(find _unpack -name project.godot -type f | head -n 1)"

            if [ -z "$PROJECT_FILE" ]; then
              echo "ERROR: project.godot отсутствует в ZIP!"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PROJECT_FILE")"
            cp -a "$PROJECT_DIR"/. .
            rm -rf _unpack
          fi

          test -f project.godot

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail

          if [ -f tools/validate_project.py ]; then
            python3 tools/validate_project.py
          else
            echo "Static validator not found, skipping."
          fi

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"


      

      - name: Download Godot 4.3
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          wget -q "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"

          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d templates_tmp

          cp -a templates_tmp/templates/. \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

          godot --version

      - name: Configure Android export
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("export_presets.cfg")
          if not path.exists():
              raise SystemExit("ERROR: export_presets.cfg not found")

          data = path.read_text(encoding="utf-8")
          replacements = {
              'keystore/debug=""':
                  f'keystore/debug="{os.environ["RUNNER_TEMP"]}/debug.keystore"',
              'keystore/debug_user=""':
                  'keystore/debug_user="androiddebugkey"',
              'keystore/debug_password=""':
                  'keystore/debug_password="android"',
          }

          for old, new in replacements.items():
              if old not in data:
                  raise SystemExit(f"ERROR: preset setting not found: {old}")
              data = data.replace(old, new, 1)

          path.write_text(data, encoding="utf-8")
          PY

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --editor --path . --import --verbose \
            2>&1 | tee import.log

      - name: Check main scene startup
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --path . --verbose --quit-after 5 \
            2>&1 | tee startup.log

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          godot --headless --path . \
            --export-debug "Android" \
            build/1kind-rp-debug.apk \
            2>&1 | tee build/export.log

          test -s build/1kind-rp-debug.apk

          echo "APK successfully created!"
          ls -lh build/1kind-rp-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 1KIND-RP-Android-Debug
          path: build/1kind-rp-debug.apk
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1KIND-RP-Build-Logs
          path: |
            import.log
            startup.log
            build/export.log
          if-no-files-found: ignore
